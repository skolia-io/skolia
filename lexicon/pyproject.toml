[project]
name = "skolia-lexicon"
version = "0.1.0"
description = "Kaikki's Wiktionary extract in, each language's lexicon (a SQLite file in the lexicon Worker's D1 schema) out"
license = "Apache-2.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "skolia",
    "structlog>=25.5",
]

[tool.uv.sources]
skolia = { workspace = true }

[project.scripts]
skolia-lexicon = "skolia_lexicon.cli:lookup_main"
skolia-build-lexicon = "skolia_lexicon.cli:build_main"
skolia-fetch-commons = "skolia_lexicon.cli:fetch_commons_main"

[dependency-groups]
dev = [
    "pyright[nodejs]>=1.1.414",
    "pytest>=8",
    "ruff>=0.17.3",
]

[tool.pyright]
include = ["src", "tests"]
stubPath = "../typings"
venvPath = ".."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "strict"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
