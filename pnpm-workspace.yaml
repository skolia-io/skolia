packages:
  - api
  - reader
  - shared
  - util
# Their install scripts check the platform binary and download it if it's missing;
# pnpm already installs it from an optional dependency (e.g. @cloudflare/workerd-darwin-arm64)
allowBuilds:
  esbuild: false
  workerd: false
# hono-openapi 1.5.0 allows standard-openapi 0.2.12, which wants a standard-json newer than 1.5.0 takes
overrides:
  "@standard-community/standard-openapi": 0.2.11
