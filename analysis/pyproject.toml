[project]
name = "skolia-analysis"
version = "0.1.0"
description = "Text in, analysis blob out"
license = "Apache-2.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "stanza>=1.15",
    "morfeusz2>=1.99",
    "transformers>=5.22.1",
    "combo-nlp==4.0.14",
    # Listed only to pick its source below; COMBO and Stanza are what need it
    "torch==2.15.0",
    "brotli>=1.2.1",
    "structlog>=25.5",
    "skolia",
]

# On Linux (the ingest container) take PyTorch's CPU-only build: the default Linux
# wheels pull in several GB of CUDA libraries the container never uses
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
skolia = { workspace = true }
skolia-lexicon = { workspace = true }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[project.scripts]
skolia-analyze = "skolia_analysis.cli:main"
skolia-ingest = "skolia_analysis.ingest.cli:main"

[dependency-groups]
# The lexicon for scripts/gen_ts_types.py (its entry types) and scripts/eval_lexicon.py
dev = [
    "pyright[nodejs]>=1.1.414",
    "pytest>=8",
    "ruff>=0.17.3",
    "skolia-lexicon",
]

[tool.pyright]
include = ["src", "tests", "scripts"]
exclude = ["scripts/vendor"]
stubPath = "../typings"
venvPath = ".."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "strict"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
