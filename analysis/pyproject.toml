[project]
name = "skolia-analysis"
version = "0.1.0"
description = "Text in, analysis blob out"
license = "Apache-2.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "stanza>=1.15",
    "morfeusz2>=1.99",
    "transformers>=5.22.1",
    "combo-nlp==4.0.14",
    # Listed only to pick its source below; COMBO and Stanza are what need it
    "torch==2.15.0",
    "brotli>=1.2.1",
    "structlog>=25.5",
]

# On Linux (the ingest container) take PyTorch's CPU-only build: the default Linux
# wheels pull in several GB of CUDA libraries the container never uses
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[project.scripts]
skolia-analyze = "skolia_analysis.cli:main"
skolia-build-lexicon = "skolia_analysis.lexicon.cli:build_main"
skolia-fetch-commons = "skolia_analysis.lexicon.cli:fetch_commons_main"
skolia-bundle = "skolia_analysis.lexicon.cli:bundle_main"
skolia-build-cards = "skolia_analysis.lexicon.cli:cards_main"
skolia-ingest = "skolia_analysis.ingest.cli:main"
skolia-build-valency = "skolia_analysis.lang.pl.valency:build_main"

[dependency-groups]
dev = [
    "pyright[nodejs]>=1.1.414",
    "pytest>=8",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["scripts/vendor"]

[tool.ruff.lint]
select = [
    "A", "B", "C4", "DTZ", "E", "EXE", "F", "FA", "FLY", "I", "INT",
    "LOG", "PERF", "PIE", "PT", "RUF", "SIM", "T10", "TID", "UP", "W",
]
# Allow intra-package relative imports and assertions that describe a single invariant.
ignore = ["TID252", "PT018"]

# IPA symbols in pronunciations: stress, length, and vowels that look like Latin letters
allowed-confusables = ["ˈ", "ː", "ɪ", "ɑ", "ɡ"]

[tool.ruff.lint.per-file-ignores]
"*.pyi" = ["PIE790"]

[tool.pyright]
include = ["src", "tests", "scripts"]
exclude = ["scripts/vendor"]
stubPath = "typings"
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "strict"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
