[project]
name = "skolia-analysis"
version = "0.1.0"
description = "Text in, analysis blob out"
license = "Apache-2.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "stanza>=1.15",
    "morfeusz2>=1.99",
    "transformers>=5.22.1",
    "combo-nlp==4.0.14",
    # Listed only to pick its source below; COMBO and Stanza are what need it
    "torch==2.15.0",
    "brotli>=1.2.1",
    "structlog>=25.5",
]

# On Linux (the ingest container) take PyTorch's CPU-only build: the default Linux
# wheels pull in several GB of CUDA libraries the container never uses
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[project.scripts]
skolia-analyze = "skolia_analysis.cli:main"
skolia-lexicon = "skolia_analysis.lexicon.cli:lookup_main"
skolia-build-lexicon = "skolia_analysis.lexicon.cli:build_main"
skolia-fetch-commons = "skolia_analysis.lexicon.cli:fetch_commons_main"
skolia-build-d1-export = "skolia_analysis.lexicon.cli:d1_export_main"
skolia-ingest = "skolia_analysis.ingest.cli:main"
skolia-build-valency = "skolia_analysis.lang.pl.valency:build_main"

[dependency-groups]
dev = [
    "pyright[nodejs]>=1.1.414",
    "pytest>=8",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["scripts/vendor"]

[tool.ruff.lint]
select = [
    "A", "ASYNC", "B", "BLE", "C4", "C90", "DTZ", "E", "EXE", "F", "FA", "FBT", "FLY", "FURB",
    "G", "I", "ICN", "INT", "ISC", "LOG", "PERF", "PGH", "PIE", "PL", "PT", "PTH", "RET",
    "RSE", "RUF", "SIM", "SLF", "SLOT", "T10", "TID", "TRY", "UP", "W",
]
# Allow intra-package relative imports and assertions that describe a single invariant.
ignore = [
    "TID252", "PT018",
    # Dispatch by match returns from each arm; branch counts catch what matters
    "PLR0911",
    # PLR0913 counts all arguments; FBT catches the unreadable positional ones
    "PLR0917",
    "PLR2004",
    # Plugins import their models lazily
    "PLC0415",
    # Polish words in test names
    "PLC2401",
    # lambda: list[T]() gives a typed default_factory
    "PLW0108",
    # pyright checks returns
    "RET503",
    "TRY003", "TRY301",
]

# IPA symbols in pronunciations: stress, length, and vowels that look like Latin letters
allowed-confusables = ["ˈ", "ː", "ɪ", "ɑ", "ɡ"]

[tool.ruff.lint.per-file-ignores]
"*.pyi" = ["PIE790"]
# Builders of parser output take a word's fields as arguments
"tests/**" = ["SLF001", "PLR0913"]

[tool.pyright]
include = ["src", "tests", "scripts"]
exclude = ["scripts/vendor"]
stubPath = "typings"
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "strict"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
