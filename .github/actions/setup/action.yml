name: Setup
description: Nix with flake.nix's packages.ci (terraform, just, Node, pnpm and uv), substituting from the andyyu2004 Cachix cache. The JS dependencies are ./.github/actions/pnpm, the Python ones' cache ./.github/actions/uv, in the jobs that use them.
inputs:
  nix-conf:
    description: Extra nix.conf lines for the Nix install
    default: ""
runs:
  using: composite
  steps:
    - uses: DeterminateSystems/determinate-nix-action@v3
      with:
        extra-conf: ${{ inputs.nix-conf }}
    # Read only: what's pushed is chosen (deploy-ingest.sh pushes all but the models), and
    # cachix push reads CACHIX_AUTH_TOKEN where a job sets it
    - uses: cachix/cachix-action@v17
      with:
        name: andyyu2004
        skipPush: true
    - run: |
        out=$(nix build --no-link --print-out-paths .#ci)
        echo "$out/bin" >> "$GITHUB_PATH"
      shell: bash
    - run: echo "TF_CLI_CONFIG_FILE=$GITHUB_WORKSPACE/infra/terraformrc" >> "$GITHUB_ENV"
      shell: bash
