name: uv cache
description: The uv workspace's Python dependencies (analysis/, lexicon/, lib/py/; torch among them, most of the cache) and interpreters, cached per lock file, for the jobs that run uv
runs:
  using: composite
  steps:
    - uses: actions/cache@v6.1.0
      with:
        path: |
          ~/.cache/uv
          ~/.local/share/uv/python
        key: uv-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('uv.lock', '.python-version') }}
