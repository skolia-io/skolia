name: Release CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# Keep main's cancel-on-push behavior separate from the PR preview queue.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

jobs:
  ci:
    permissions:
      actions: read
      contents: read
      pull-requests: write
    uses: ./.github/workflows/ci.yml
    secrets: inherit
