name: Sync curated

# The curated texts in curated/ (just sync-curated), after deploy.yml's skolia Worker, beside
# the end-to-end tests. Shares deploy-web's concurrency group, so a sync waits for a deploy in
# progress.

on:
  workflow_call:
    inputs:
      env:
        type: string
        required: true

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  sync-curated:
    # Not success(), which a skipped job before its caller makes false (deploy.yml)
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    environment: ${{ startsWith(inputs.env, 'pr-') && 'preview' || inputs.env }}
    concurrency:
      group: deploy-web-${{ inputs.env }}
      cancel-in-progress: false
    steps:
      # The tags and history: the key it records has the skolia Worker's version (infra/plan.py)
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/pnpm
      - run: just sync-curated ${{ inputs.env }}
