# A pull request's title is a conventional commit ("feat: add …", "fix(reader): …"), since it
# becomes the squashed commit on main. Its own workflow so that editing the title reruns only
# this. The merge queue requires it too, where there's no title to check.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  merge_group:

permissions: {}

jobs:
  pr-title:
    runs-on: ubuntu-24.04
    steps:
      - if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! grep -qE '^(feat|fix|perf|refactor|docs|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: [^ ]' <<< "$TITLE"; then
            echo "the title isn't a conventional commit (type(scope)?: description): $TITLE" >&2
            exit 1
          fi
