name: Deploy

# One environment, as ci.yml's plan (infra/plan.py) says: the images and the skolia
# Worker's build it says are missing, beside Terraform and migrations; then the ingest Worker
# and the lexicon; then the skolia Worker (reader and API); then, side by side, the end-to-end
# tests (e2e) and the curated texts in curated/ (sync-curated, sync-curated.yml). The ingest
# Worker consumes the queue the skolia Worker feeds, so it goes first. Each job runs only if
# the plan says its key isn't what the environment has, and records its key once it's done.
# One deploy of an environment runs at a time (ci.yml's concurrency), so no older deploy
# lands between the plan and what it skipped. A newer push cancels the run, but a step that
# changes what's deployed finishes first (.github/uninterruptible.sh). Previews (pr-<N>)
# share one GitHub environment, preview. Jobs check the PR again before using its preview,
# since reruns can start after it closes.

on:
  workflow_call:
    inputs:
      env:
        type: string
        required: true
      plan:
        description: The environment's plan, from ci.yml's (infra/plan.py plan)
        type: string
        required: true
    outputs:
      serving:
        description: true once the skolia Worker's deployed or current, even if a later step fails
        value: ${{ (jobs.deploy-web.outputs.deployed || !fromJSON(inputs.plan).web) && 'true' || '' }}
      e2e:
        description: The end-to-end tests' result (success, failure or cancelled), current if they passed against what's deployed before, empty if they didn't run
        value: ${{ jobs.e2e.outputs.result || (!fromJSON(inputs.plan).e2e && 'current') || '' }}

permissions:
  contents: read
  pull-requests: read
  actions: read

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  # The images are named by their inputs, not the environment, so one built for a preview
  # serves staging and production too
  build-ingest-image:
    if: toJSON(fromJSON(inputs.plan).images) != '[]'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        lang: ${{ fromJSON(inputs.plan).images }}
    steps:
      - uses: actions/checkout@v7
      # The model downloads read HF_TOKEN (impureEnvVars) from the daemon, not this job
      - uses: ./.github/actions/setup
        with:
          nix-conf: |
            extra-experimental-features = configurable-impure-env
            impure-env = HF_TOKEN=${{ secrets.HF_TOKEN }}
      - uses: ./.github/actions/pnpm
      - run: infra/deploy-ingest.sh build ${{ matrix.lang }}
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}

  # The skolia Worker (flake.nix skolia-worker), into Cachix for deploy-web, while what it
  # waits for runs; built once for every environment
  build-web:
    if: fromJSON(inputs.plan).worker
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: |
          nix build --no-link --print-out-paths .#skolia-worker | cachix push andyyu2004
          infra/plan.py built worker
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}

  deploy-infra:
    if: fromJSON(inputs.plan).infra
    runs-on: ubuntu-24.04
    environment: ${{ startsWith(inputs.env, 'pr-') && 'preview' || inputs.env }}
    env:
      TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
      TF_IN_AUTOMATION: "1"
      TF_CLI_ARGS_apply: -auto-approve
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/pnpm
      - id: preview
        uses: ./.github/actions/preview-state
        with:
          env: ${{ inputs.env }}
      - if: steps.preview.outputs.state == 'open'
        run: .github/uninterruptible.sh just deploy-infra ${{ inputs.env }}

  # The lexicon for cards, built with Nix from the lexicon and venv build-ingest-image put
  # in Cachix (just load-lexicon), so after it when it runs
  load-lexicon:
    needs: [deploy-infra, build-ingest-image]
    if: ${{ !cancelled() && !failure() && fromJSON(inputs.plan).lexicon }}
    runs-on: ubuntu-24.04
    environment: ${{ startsWith(inputs.env, 'pr-') && 'preview' || inputs.env }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/pnpm
      - id: preview
        uses: ./.github/actions/preview-state
        with:
          env: ${{ inputs.env }}
      - if: steps.preview.outputs.state == 'open'
        run: just load-lexicon ${{ inputs.env }}
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}

  # API-owned internal capabilities: no ingest bindings, so deploy before callers.
  deploy-internal:
    needs: deploy-infra
    if: ${{ !cancelled() && !failure() && fromJSON(inputs.plan).internal }}
    runs-on: ubuntu-24.04
    environment: ${{ startsWith(inputs.env, 'pr-') && 'preview' || inputs.env }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/pnpm
      - id: preview
        uses: ./.github/actions/preview-state
        with:
          env: ${{ inputs.env }}
      - if: steps.preview.outputs.state == 'open'
        run: .github/uninterruptible.sh just deploy-internal ${{ inputs.env }}

  # Its status publisher, storage and images must exist first.
  deploy-ingest:
    needs: [deploy-infra, deploy-internal, build-ingest-image]
    if: ${{ !cancelled() && !failure() && fromJSON(inputs.plan).ingest }}
    runs-on: ubuntu-24.04
    environment: ${{ startsWith(inputs.env, 'pr-') && 'preview' || inputs.env }}
    env:
      TF_IN_AUTOMATION: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/pnpm
      - id: preview
        uses: ./.github/actions/preview-state
        with:
          env: ${{ inputs.env }}
      - if: steps.preview.outputs.state == 'open'
        run: .github/uninterruptible.sh infra/deploy-ingest.sh ${{ inputs.env }} deploy

  # After the lexicon is loaded: the end-to-end tests' card and lexicon journeys read it
  deploy-web:
    needs: [build-web, deploy-infra, deploy-internal, deploy-ingest, load-lexicon]
    if: ${{ !cancelled() && !failure() && fromJSON(inputs.plan).web }}
    runs-on: ubuntu-24.04
    environment: ${{ startsWith(inputs.env, 'pr-') && 'preview' || inputs.env }}
    # Shared with sync-curated.yml, so a sync without a deploy waits for one
    concurrency:
      group: deploy-web-${{ inputs.env }}
      cancel-in-progress: false
    # A preview's wrangler config is made in each job that needs it (infra/wrangler.sh)
    env:
      TF_IN_AUTOMATION: "1"
      # The environment's Google OAuth client (infra/README.md); the previews' is skolia-preview
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      # The preview environment's only: its sign-in goes through the OAuth proxy (oauth-proxy/)
      OAUTH_PROXY_SECRET: ${{ secrets.OAUTH_PROXY_SECRET }}
    outputs:
      deployed: ${{ steps.deploy.outputs.deployed }}
    steps:
      # The tags and history, for the version
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/pnpm
      - id: preview
        uses: ./.github/actions/preview-state
        with:
          env: ${{ inputs.env }}
      - name: Warm ingest for e2e
        if: steps.preview.outputs.state == 'open' && vars.WARM_INGEST == 'true' && fromJSON(inputs.plan).e2e
        continue-on-error: true
        run: just warm-ingest ${{ inputs.env }}
      - id: deploy
        if: steps.preview.outputs.state == 'open'
        run: |
          .github/uninterruptible.sh just deploy-web ${{ inputs.env }}
          echo "deployed=true" >> "$GITHUB_OUTPUT"

  # A skipped job anywhere before makes success() false, so each job after one that may be
  # skipped says what it needs: deploy-web deployed or current. Each runs only if the plan
  # says what it ran against, or its input, changed since it last passed.
  e2e:
    needs: deploy-web
    if: ${{ !cancelled() && !failure() && fromJSON(inputs.plan).e2e }}
    runs-on: ubuntu-24.04
    environment: ${{ startsWith(inputs.env, 'pr-') && 'preview' || inputs.env }}
    outputs:
      result: ${{ steps.result.outputs.result }}
    steps:
      # The tags and history, for the version
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/pnpm
      - id: preview
        uses: ./.github/actions/preview-state
        with:
          env: ${{ inputs.env }}
      - if: steps.preview.outputs.state == 'open'
        run: just e2e ${{ inputs.env }}
      - id: result
        if: always() && steps.preview.outputs.state != 'closed'
        run: echo "result=${{ job.status }}" >> "$GITHUB_OUTPUT"

  sync-curated:
    needs: deploy-web
    if: ${{ !cancelled() && !failure() && fromJSON(inputs.plan).curated }}
    uses: ./.github/workflows/sync-curated.yml
    with:
      env: ${{ inputs.env }}
    secrets: inherit

  # A Gantt chart of the run's jobs and steps up to here, in its summary
  timeline:
    if: always()
    needs: [deploy-web, e2e, sync-curated]
    runs-on: ubuntu-24.04
    steps:
      - uses: Kesin11/actions-timeline@v3.2.1
