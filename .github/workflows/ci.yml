name: CI

# Every push and pull request, and each merge group in main's merge queue: checks and
# tests (the check job, which the queue requires). Pull requests: a plan per environment,
# and a preview environment, pr-<number>, deployed and end-to-end tested on each push and torn
# down when the pull request closes (sweep.yml catches any left); the mergeable job
# gates merging on it and on the screenshots. A comment on the pull request links to the preview, and says when
# it's torn down (.github/preview-comment.sh).
# main: deploy staging and end-to-end test it, deploy the previews' OAuth proxy, and apply infra/shared/ if it may have changed. A v* tag on a commit in main: staging, then production.
# Deploys don't wait for check: a preview is up while it runs, and main and tags have passed
# it in the merge queue. Each deploy skips what's already current (deploy.yml's plan). The
# steps are just recipes (justfile) and infra/deploy-ingest.sh, so a deploy by hand runs the
# same commands.
# A pull request, merge group or push to main that only changes content (curated texts, docs,
# Markdown; .github/changes.py) skips check, the screenshots, the plans and
# the deploys. If texts changed, it checks they parse (check-curated) and runs just sync-curated:
# against staging on a push to main, and against the pull request's preview if an earlier
# push deployed one. The plans run only when something they read changed.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    types: [opened, synchronize, reopened, closed]
  merge_group:
  workflow_dispatch:

# One run at a time for a pull request (its pushes and its close) and for main, so one
# deploy of an environment at a time: a newer run cancels this one, and starts once it has
# stopped. A step that changes what's deployed finishes first (.github/uninterruptible.sh).
# A tag's run and a merge group's run aren't cancelled; a tag's staging deploy waits for
# main's (deploy-staging).
concurrency:
  group: ci-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}

# actions: read is for actions-timeline (deploy.yml), which lists the run's jobs
permissions:
  contents: read
  actions: read

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  # deploy, curated and infra, from the files the run changes (.github/changes.py)
  changes:
    if: github.event.action != 'closed'
    runs-on: ubuntu-24.04
    outputs:
      deploy: ${{ steps.changes.outputs.deploy }}
      curated: ${{ steps.changes.outputs.curated }}
      infra: ${{ steps.changes.outputs.infra }}
      checks: ${{ steps.checks.outputs.checks }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: changes
        run: python3 -I .github/changes.py "$GITHUB_EVENT_NAME" "$GITHUB_EVENT_PATH"
      # The checks whose keys haven't passed (infra/plan.py); all of them for a fork's pull
      # request, which has no token
      - uses: ./.github/actions/setup
      - id: checks
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: echo "checks=$(python3 -I infra/plan.py checks)" >> "$GITHUB_OUTPUT"

  mirror-providers:
    if: github.event.action != 'closed' && needs.changes.outputs.deploy == 'true'
    needs: changes
    runs-on: ubuntu-24.04
    concurrency:
      group: mirror-providers
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: infra/mirror-providers.py
        timeout-minutes: 10

  check:
    if: github.event.action != 'closed' && needs.changes.outputs.deploy == 'true' && fromJSON(needs.changes.outputs.checks).check
    needs: [changes, mirror-providers]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: just check
      - run: just test
      - run: python3 -I infra/plan.py passed check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  # The reader's pages against their baselines (just screenshot), on arm64 like the
  # Docker image on a Mac that takes them. A failure's expected, actual and diff images
  # are in its screenshots artifact.
  # In place of check, for a run that only changes content, some of it curated texts: that
  # they parse (api/src/curated.test.ts) and resolve, fetched from their sources as the sync
  # would (api/src/check-curated.ts), which needs no build or Worker. A docs-only run checks
  # nothing.
  check-curated:
    if: github.event.action != 'closed' && needs.changes.outputs.deploy == 'false' && needs.changes.outputs.curated == 'true'
    needs: changes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --test src/curated.test.ts
        working-directory: api
      - run: node src/check-curated.ts ../curated
        working-directory: api

  screenshots:
    if: github.event.action != 'closed' && needs.changes.outputs.deploy == 'true' && fromJSON(needs.changes.outputs.checks).screenshots
    needs: changes
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: ./.github/actions/setup
      - run: just screenshot
      - run: python3 -I infra/plan.py passed screenshots
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: |
            reader/playwright-report/
            reader/test-results/

  # Only when something a plan reads changed (.github/changes.py)
  plan-infra:
    if: needs.changes.outputs.infra == 'true' && github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository && toJSON(fromJSON(needs.changes.outputs.checks).plan_infra) != '[]'
    needs: [changes, mirror-providers]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        env: ${{ fromJSON(needs.changes.outputs.checks).plan_infra }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
      TF_IN_AUTOMATION: "1"
      TF_CLI_ARGS_plan: -lock=false
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: just plan ${{ matrix.env }}
      - run: python3 -I infra/plan.py passed plan-infra-${{ matrix.env }}

  # Pull requests from forks get neither: they'd need the secrets
  deploy-preview:
    if: needs.changes.outputs.deploy == 'true' && github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    needs: [changes, mirror-providers]
    uses: ./.github/workflows/deploy.yml
    with:
      env: pr-${{ github.event.number }}
    secrets: inherit

  # Once the preview's Worker is deployed, even if its end-to-end tests then fail: links to it
  # for a tester, with the commit it runs. One comment, edited by each deploy.
  comment-preview:
    if: always() && needs.deploy-preview.outputs.url != ''
    needs: deploy-preview
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      URL: ${{ needs.deploy-preview.outputs.url }}
      SHA: ${{ github.event.pull_request.head.sha }}
      RESULT: ${{ needs.deploy-preview.outputs.e2e }}
      RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
      - run: |
          case $RESULT in
            success) tests="passed" ;;
            current) tests="passed on an earlier deploy of the same code" ;;
            "") tests="didn't run" ;;
            *) tests="didn't pass ($RESULT)" ;;
          esac
          .github/preview-comment.sh ${{ github.event.number }} <<EOF
          **Preview:** $URL

          Deployed from $SHA; its end-to-end tests $tests ([run]($RUN)). It's torn down when this pull request closes.
          EOF

  # Required by main's ruleset, with check. It fails if check should have run and didn't
  # pass, or if check-curated failed. On a pull request it also needs the preview deployed,
  # its end-to-end tests passed and its curated texts synced, unless the pull request only changes content, which
  # gets no preview. A merge group can't have a preview, and its pull request's passed to
  # get there, so there it needs only the checks. A fork's pull request gets no preview and
  # skips this, which counts as passing; check itself is required too.
  mergeable:
    if: always() && (github.event_name == 'merge_group' || (github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository))
    needs: [changes, check, screenshots, check-curated, deploy-preview, sync-curated-preview]
    runs-on: ubuntu-24.04
    steps:
      - if: needs.check-curated.result == 'failure'
        run: |
          echo "a curated text doesn't parse" >&2
          exit 1
      - if: github.event_name == 'pull_request' && needs.sync-curated-preview.result == 'failure'
        run: |
          echo "syncing the curated texts to the preview failed" >&2
          exit 1
      # A skipped check counts as passing, so a run that should check must have
      - if: needs.changes.result != 'success'
        run: |
          echo "couldn't tell what the run changes: ${{ needs.changes.result }}" >&2
          exit 1
      # A check whose key already passed is skipped (infra/plan.py)
      - if: needs.changes.outputs.deploy == 'true' && fromJSON(needs.changes.outputs.checks).check && needs.check.result != 'success'
        run: |
          echo "check didn't pass: ${{ needs.check.result }}" >&2
          exit 1
      - if: needs.changes.outputs.deploy == 'true' && fromJSON(needs.changes.outputs.checks).screenshots && needs.screenshots.result != 'success'
        run: |
          echo "the screenshots didn't match: ${{ needs.screenshots.result }}" >&2
          exit 1
      - if: github.event_name == 'pull_request' && needs.changes.outputs.deploy == 'true' && needs.deploy-preview.result != 'success'
        run: |
          echo "the preview's deploy, end-to-end tests or curated sync didn't pass: ${{ needs.deploy-preview.result }}" >&2
          exit 1
      # A skipped job counts as passing, so the preview's end-to-end tests must have passed,
      # in this run or, against the same deploys, an earlier one (current)
      - if: github.event_name == 'pull_request' && needs.changes.outputs.deploy == 'true' && needs.deploy-preview.outputs.e2e != 'success' && needs.deploy-preview.outputs.e2e != 'current'
        run: |
          echo "the preview's end-to-end tests didn't pass: '${{ needs.deploy-preview.outputs.e2e }}'" >&2
          exit 1

  # A pull request that only changes content, some of it curated texts: syncs them to its
  # preview if an earlier push deployed one (deploy-preview syncs a preview it deploys)
  sync-curated-preview:
    if: needs.changes.outputs.deploy == 'false' && needs.changes.outputs.curated == 'true' && github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    needs: [changes, check-curated]
    uses: ./.github/workflows/sync-curated.yml
    with:
      env: pr-${{ github.event.number }}
      if-deployed: true
    secrets: inherit

  teardown-preview:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_IN_AUTOMATION: "1"
    steps:
      # The base branch: the pull request's may be deleted already
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.ref }}
      - uses: ./.github/actions/setup
      - run: .github/uninterruptible.sh just teardown pr-${{ github.event.number }}
      # Only edits a comment a deploy left: one that didn't deploy has nothing to say
      - run: |
          echo "**Preview:** torn down when this pull request closed." | .github/preview-comment.sh ${{ github.event.number }} --if-exists
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

  # The account's resources that aren't any environment's (infra/shared/), from main, when
  # something a plan reads changed
  deploy-shared:
    if: needs.changes.outputs.infra == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [changes, mirror-providers]
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
      TF_IN_AUTOMATION: "1"
      TF_CLI_ARGS_apply: -auto-approve
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: .github/uninterruptible.sh just apply shared
      - run: .github/uninterruptible.sh just migrate-ci

  # A tag's and main's runs both deploy staging: one at a time, as deploy.yml's plan reads
  # what's deployed
  deploy-staging:
    if: needs.changes.outputs.deploy == 'true' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [changes, mirror-providers]
    concurrency:
      group: environment-staging
      cancel-in-progress: false
    uses: ./.github/workflows/deploy.yml
    with:
      env: staging
    secrets: inherit

  # The previews' Google sign-in (oauth-proxy/): one for all of them, from main
  deploy-oauth-proxy:
    if: needs.changes.outputs.deploy == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: changes
    runs-on: ubuntu-24.04
    environment: oauth-proxy
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      OAUTH_PROXY_SECRET: ${{ secrets.OAUTH_PROXY_SECRET }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: .github/uninterruptible.sh just deploy-oauth-proxy

  # A push to main that only changes content, some of it curated texts. A tag always
  # deploys (deploy-staging), which syncs them.
  sync-curated-staging:
    if: needs.changes.outputs.deploy == 'false' && needs.changes.outputs.curated == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [changes, check-curated]
    uses: ./.github/workflows/sync-curated.yml
    with:
      env: staging
    secrets: inherit

  check-tag-on-main:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

  deploy-production:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [deploy-staging, check-tag-on-main]
    concurrency:
      group: environment-production
      cancel-in-progress: false
    uses: ./.github/workflows/deploy.yml
    with:
      env: production
    secrets: inherit
