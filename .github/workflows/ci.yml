name: CI

# Every push and pull request, and each merge group in main's merge queue. One plan at the
# start (infra/plan.py) says what the run needs to do, and every job runs only if it says so:
# a check for each project (just check-project, in a matrix), the screenshots and each
# environment's terraform plan, for what they read that hasn't passed; and the deploys:
# a pull request's preview, pr-<number> (deploy.yml), deployed and end-to-end tested on each
# push and torn down when the pull request closes (sweep.yml catches any left); from main,
# staging and the account's shared resources (infra/shared/ and skolia-ci, and the previews'
# OAuth proxy); from a v* tag on a commit in main, staging, then production. A preview that
# would be the same as staging isn't deployed. The mergeable job gates merging on the checks
# and the preview. A comment on the pull request links to the preview, and says when it's
# torn down (.github/preview-comment.sh). Deploys don't wait for check: a preview is up while
# it runs, and main and tags have passed it in the merge queue. The steps are just recipes
# (justfile) and infra/deploy-ingest.sh, so a deploy by hand runs the same commands.

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  merge_group:
  workflow_call:
    inputs:
      command:
        type: string
        default: ""

# Serialize PR pushes, closes and authorized commands. Release CI has its own queue.
concurrency:
  group: ci-${{ (github.event.pull_request.number || github.event.issue.number) && format('pr-{0}', github.event.pull_request.number || github.event.issue.number) || (github.event_name == 'merge_group' && github.ref) || format('run-{0}', github.run_id) }}
  queue: max

# actions: read is for actions-timeline (deploy.yml), which lists the run's jobs
permissions:
  contents: read
  actions: read

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
  PR: ${{ github.event.pull_request.number || github.event.issue.number }}

jobs:
  # Read the live PR after acquiring the lock: queued events can arrive out of order.
  preview:
    if: inputs.command != '' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read
    outputs:
      env: ${{ steps.pr.outputs.env }}
      head: ${{ steps.pr.outputs.head }}
      ref: ${{ steps.pr.outputs.ref }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ACTION: ${{ github.event.action }}
      COMMAND: ${{ inputs.command }}
      EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
      EVENT_BASE: ${{ github.event.pull_request.base.sha }}
    steps:
      - id: pr
        shell: bash
        run: |
          pr=$(gh api "repos/{owner}/{repo}/pulls/$PR")
          state=$(jq -r '.state' <<<"$pr")
          head=$(jq -r '.head.sha' <<<"$pr")
          case "$ACTION:$COMMAND" in
            closed:) [[ "$state" == closed ]] || exit 0 ;;
            created:teardown|created:reset)
              if ! jq -e --arg repo "$GH_REPO" '.state == "open" and .head.repo.full_name == $repo' <<<"$pr" >/dev/null; then
                echo 'Preview commands require an open PR from this repository.' >&2
                exit 1
              fi ;;
            *:) [[ "$state" == open && "$head" == "$EVENT_HEAD" ]] || exit 0 ;;
            *) exit 1 ;;
          esac
          if [[ "$COMMAND" == reset || ( "$COMMAND" == '' && "$state" == open ) ]]; then
            ref=$(jq -r 'select(.mergeable == true) | .merge_commit_sha // empty' <<<"$pr")
            if [[ -z "$ref" && "$COMMAND" == '' && $(jq -r '.base.sha' <<<"$pr") == "$EVENT_BASE" ]]; then
              ref=$GITHUB_SHA
            fi
            [[ "$ref" =~ ^[0-9a-f]{40}$ ]] || { echo 'No current test merge revision; try again shortly.' >&2; exit 1; }
            echo "ref=$ref" >> "$GITHUB_OUTPUT"
          fi
          printf 'env=pr-%s\nhead=%s\n' "$PR" "$head" >> "$GITHUB_OUTPUT"

  # The checks whose keys haven't passed, and the deploys of the environments this run
  # deploys whose keys they don't have (infra/plan.py plan). A fork's pull request has no
  # token, so it runs every check and deploys nothing.
  plan:
    needs: preview
    if: ${{ !cancelled() && !failure() && github.event.action != 'closed' && (inputs.command == '' || inputs.command == 'reset') }}
    runs-on: ubuntu-24.04
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      url: ${{ steps.url.outputs.url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PREVIEW: ${{ needs.preview.outputs.env }}
    steps:
      # The tags and history, for the version
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.preview.outputs.ref }}
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - id: plan
        shell: bash
        run: |
          case "$GITHUB_EVENT_NAME $GITHUB_REF" in
            issue_comment*) args=(--fresh-preview "$PREVIEW") ;;
            pull_request*) args=(); [[ -z "$PREVIEW" ]] || args=("$PREVIEW") ;;
            "push refs/heads/main" | "workflow_dispatch refs/heads/main") args=(staging shared) ;;
            "push refs/tags/v"*) args=(staging production) ;;
            *) args=() ;;
          esac
          plan=$(infra/plan.py plan "${args[@]}")
          echo "plan=$plan" >> "$GITHUB_OUTPUT"
      - id: url
        if: env.PREVIEW != ''
        run: echo "url=$(just url "$PREVIEW")" >> "$GITHUB_OUTPUT"

  mirror-providers:
    if: ${{ !cancelled() && !failure() && needs.plan.result == 'success' && fromJSON(needs.plan.outputs.plan).terraform }}
    needs: [preview, plan]
    runs-on: ubuntu-24.04
    concurrency:
      group: mirror-providers
      queue: max
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.preview.outputs.ref }}
      - uses: astral-sh/setup-uv@v10.3.3
      - run: infra/mirror-providers.py
        timeout-minutes: 10

  # The jobs after mirror-providers, which may be skipped, run if it didn't fail
  check:
    if: ${{ !cancelled() && !failure() && inputs.command == '' && needs.plan.result == 'success' && toJSON(fromJSON(needs.plan.outputs.plan).check) != '[]' }}
    needs: [preview, plan, mirror-providers]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.plan.outputs.plan).check }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.preview.outputs.ref }}
      - uses: ./.github/actions/setup
      - if: matrix.project != 'analysis'
        uses: ./.github/actions/pnpm
      - if: matrix.project == 'analysis'
        uses: ./.github/actions/uv
      - run: just check-project ${{ matrix.project }}
      - run: python3 -I infra/plan.py passed check-${{ matrix.project }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  # The reader's pages against their baselines (just screenshot), on arm64 like the
  # Docker image on a Mac that takes them. A failure's expected, actual and diff images
  # are in its screenshots artifact.
  screenshots:
    if: ${{ !cancelled() && !failure() && inputs.command == '' && needs.plan.result == 'success' && fromJSON(needs.plan.outputs.plan).screenshots }}
    needs: [preview, plan]
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.preview.outputs.ref }}
          lfs: true
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/pnpm
      - run: just screenshot
      - run: python3 -I infra/plan.py passed screenshots
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: |
            reader/playwright-report/
            reader/test-results/

  # Pull requests from forks get neither the plans nor a preview: they'd need the secrets
  plan-infra:
    if: ${{ !cancelled() && !failure() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && needs.plan.result == 'success' && toJSON(fromJSON(needs.plan.outputs.plan).plan_infra) != '[]' }}
    needs: [preview, plan, mirror-providers]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        env: ${{ fromJSON(needs.plan.outputs.plan).plan_infra }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
      TF_IN_AUTOMATION: "1"
      TF_CLI_ARGS_plan: -lock=false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.preview.outputs.ref }}
      - uses: ./.github/actions/setup
      - run: just plan ${{ matrix.env }}
      - run: python3 -I infra/plan.py passed plan-infra-${{ matrix.env }}

  deploy-preview:
    if: ${{ !cancelled() && !failure() && needs.preview.outputs.env != '' && needs.plan.result == 'success' && fromJSON(needs.plan.outputs.plan).deploys[needs.preview.outputs.env] && (inputs.command != 'reset' || needs.teardown-preview.result == 'success') }}
    needs: [preview, plan, mirror-providers, teardown-preview]
    uses: ./.github/workflows/deploy.yml
    with:
      env: ${{ needs.preview.outputs.env }}
      ref: ${{ needs.preview.outputs.ref }}
      plan: ${{ toJSON(fromJSON(needs.plan.outputs.plan).deploys[needs.preview.outputs.env]) }}
    secrets: inherit

  # One status comment for deploys and teardowns. Keep the link if only the tests failed.
  comment-preview:
    if: ${{ !cancelled() && (needs.deploy-preview.outputs.serving == 'true' || needs.teardown-preview.result == 'success') }}
    needs: [preview, plan, deploy-preview, teardown-preview]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      URL: ${{ needs.plan.outputs.url }}
      SHA: ${{ needs.preview.outputs.head }}
      ACTION: ${{ github.event.action }}
      SERVING: ${{ needs.deploy-preview.outputs.serving }}
      RESULT: ${{ needs.deploy-preview.outputs.e2e }}
      RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
      - run: |
          if [[ "$ACTION" == closed ]]; then
            echo '**Preview:** torn down when this pull request closed.' | .github/preview-comment.sh "$PR" --if-exists
            exit
          elif [[ -z "$URL" ]]; then
            status="**Preview:** torn down on request ([run]($RUN))."
          elif [[ "$SERVING" != true ]]; then
            status="**Preview:** torn down, but redeploy failed ([run]($RUN))."
          else
            case $RESULT in
              success) tests="passed" ;;
              current) tests="passed on an earlier deploy of the same code" ;;
              "") tests="didn't run" ;;
              *) tests="didn't pass ($RESULT)" ;;
            esac
            status="**Preview:** $URL

          Deployed from $SHA; its end-to-end tests $tests ([run]($RUN)). It's torn down when this pull request closes."
          fi
          .github/preview-comment.sh "$PR" <<EOF
          $status

          Repo writers: post \`/preview teardown\` to delete this preview and its data, or \`/preview reset\` to delete and rebuild it.
          EOF

  # Required by main's ruleset, with check. It fails if the plan failed, if a check the plan
  # said was needed didn't pass, or, on a pull request with a preview, if its deploy failed or
  # its end-to-end tests haven't passed, in this run or against the same deploys in an
  # earlier one (current). A preview that would be staging isn't deployed, and staging passed
  # its tests. A fork's pull request skips this, which counts as passing; check itself is
  # required too.
  mergeable:
    if: always() && (github.event_name == 'merge_group' || (github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository))
    needs: [plan, check, screenshots, deploy-preview]
    runs-on: ubuntu-24.04
    env:
      PREVIEW: ${{ needs.plan.result == 'success' && github.event_name == 'pull_request' && toJSON(fromJSON(needs.plan.outputs.plan).deploys[format('pr-{0}', github.event.number)]) != 'null' }}
    steps:
      - if: needs.plan.result != 'success'
        run: |
          echo "the plan didn't run: ${{ needs.plan.result }}" >&2
          exit 1
      - if: toJSON(fromJSON(needs.plan.outputs.plan).check) != '[]' && needs.check.result != 'success'
        run: |
          echo "check didn't pass: ${{ needs.check.result }}" >&2
          exit 1
      - if: fromJSON(needs.plan.outputs.plan).screenshots && needs.screenshots.result != 'success'
        run: |
          echo "the screenshots didn't match: ${{ needs.screenshots.result }}" >&2
          exit 1
      - if: env.PREVIEW == 'true' && needs.deploy-preview.result != 'success'
        run: |
          echo "the preview's deploy, end-to-end tests or curated sync didn't pass: ${{ needs.deploy-preview.result }}" >&2
          exit 1
      - if: env.PREVIEW == 'true' && needs.deploy-preview.outputs.e2e != 'success' && needs.deploy-preview.outputs.e2e != 'current'
        run: |
          echo "the preview's end-to-end tests didn't pass: '${{ needs.deploy-preview.outputs.e2e }}'" >&2
          exit 1

  teardown-preview:
    needs: [preview, plan, mirror-providers]
    if: ${{ !cancelled() && needs.preview.outputs.env != '' && (github.event.action == 'closed' || inputs.command == 'teardown' || (inputs.command == 'reset' && needs.mirror-providers.result == 'success')) }}
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_IN_AUTOMATION: "1"
      PREVIEW: ${{ needs.preview.outputs.env }}
    steps:
      # The base branch on close, or the comment event's default-branch revision.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.ref }}
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/pnpm
      - run: .github/uninterruptible.sh just teardown "$PREVIEW"

  # The account's resources that aren't any environment's (infra/shared/) and skolia-ci's
  # tables, from main
  deploy-shared:
    if: ${{ !cancelled() && !failure() && needs.plan.result == 'success' && fromJSON(needs.plan.outputs.plan).deploys.shared['infra-shared'] }}
    needs: [plan, mirror-providers]
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
      TF_IN_AUTOMATION: "1"
      TF_CLI_ARGS_apply: -auto-approve
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/pnpm
      - run: .github/uninterruptible.sh just deploy-shared

  # A tag's and main's runs both deploy staging: one at a time, as the plan reads what's
  # deployed
  deploy-staging:
    if: ${{ !cancelled() && !failure() && needs.plan.result == 'success' && fromJSON(needs.plan.outputs.plan).deploys.staging }}
    needs: [plan, mirror-providers]
    concurrency:
      group: environment-staging
      cancel-in-progress: false
    uses: ./.github/workflows/deploy.yml
    with:
      env: staging
      plan: ${{ toJSON(fromJSON(needs.plan.outputs.plan).deploys.staging) }}
    secrets: inherit

  # The previews' Google sign-in (oauth-proxy/): one for all of them, from main
  deploy-oauth-proxy:
    if: needs.plan.result == 'success' && fromJSON(needs.plan.outputs.plan).deploys.shared['oauth-proxy']
    needs: plan
    runs-on: ubuntu-24.04
    environment: oauth-proxy
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      OAUTH_PROXY_SECRET: ${{ secrets.OAUTH_PROXY_SECRET }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/pnpm
      - run: .github/uninterruptible.sh just deploy-oauth-proxy

  check-tag-on-main:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

  deploy-production:
    if: ${{ !cancelled() && !failure() && needs.plan.result == 'success' && fromJSON(needs.plan.outputs.plan).deploys.production }}
    needs: [plan, deploy-staging, check-tag-on-main]
    concurrency:
      group: environment-production
      cancel-in-progress: false
    uses: ./.github/workflows/deploy.yml
    with:
      env: production
      plan: ${{ toJSON(fromJSON(needs.plan.outputs.plan).deploys.production) }}
    secrets: inherit
