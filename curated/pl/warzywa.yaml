kind: inline
title: Warzywa
author: Julian Tuwim
licence: public-domain
source: https://wolnelektury.pl/katalog/lektura/tuwim-warzywa/
tags:
  level: A1
text: |-
  Położyła kucharka na stole:
  kartofle,
  buraki,
  marchewkę,
  fasolę,
  kapustę,
  pietruszkę,
  selery
  i groch.
  Och!
  Zaczęły się kłótnie,
  Kłócą się okrutnie:
  Kto z nich większy,
  A kto mniejszy,
  Kto ładniejszy,
  Kto zgrabniejszy:
  kartofle?
  buraki?
  marchewka?
  fasola?
  kapusta?
  pietruszka?
  selery
  czy groch?
  Ach!
  Nakrzyczały się, że strach!
  Wzięła kucharka,
  Nożem ciach!
  Pokrajała, posiekała:
  kartofle,
  buraki,
  marchewkę,
  fasolę,
  kapustę,
  pietruszkę,
  selery
  i groch —
  I do garnka!
