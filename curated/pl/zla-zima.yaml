kind: inline
title: Zła zima
author: Maria Konopnicka
licence: public-domain
source: https://wolnelektury.pl/katalog/lektura/zla-zima/
tags:
  level: A2
text: |-
  Hu! hu! ha!
  Nasza zima zła!
  Szczypie w nosy, szczypie w uszy,
  Mroźnym śniegiem w oczy prószy,
  Wichrem w polu gna!
  Nasza zima zła!

  Hu! hu! ha!
  Nasza zima zła!
  Płachta na niej długa, biała,
  W ręku gałąź oszroniała,
  A na plecach drwa…
  Nasza zima zła!

  Hu! hu! ha!
  Nasza zima zła!
  A my jej się nie boimy,
  Dalej śnieżkiem w plecy zimy,
  Niech pamiątkę ma.
  Nasza zima zła!
