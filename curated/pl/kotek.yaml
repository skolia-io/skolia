kind: inline
title: Kotek
author: Julian Tuwim
licence: public-domain
source: https://wolnelektury.pl/katalog/lektura/tuwim-kotek/
tags:
  level: A1
text: |-
  Miauczy kotek: miau!
  — Coś ty, kotku, miał?
  — Miałem ja miseczkę mleczka,
  Teraz pusta już miseczka,
  A jeszcze bym chciał.

  Wzdycha kotek: o!
  — Co ci, kotku, co?
  — Śniła mi się wielka rzeka,
  Wielka rzeka, pełna mleka
  Aż po samo dno.

  Pisnął kotek: piii…
  — Pij, koteczku, pij!
  …Skulił ogon, zmrużył ślipie,
  Śpi — i we śnie mleczko chlipie,
  Bo znów mu się śni.
