kind: inline
title: Abecadło
author: Julian Tuwim
licence: public-domain
source: https://wolnelektury.pl/katalog/lektura/tuwim-abecadlo/
tags:
  level: A2
text: |-
  Abecadło z pieca spadło,
  O ziemię się hukło,
  Rozsypało się po kątach,
  Strasznie się potłukło:
  I — zgubiło kropeczkę,
  H — złamało kładeczkę,
  B — zbiło sobie brzuszki,
  A — zwichnęło nóżki,
  O — jak balon pękło,
  aż się P przelękło,
  T — daszek zgubiło,
  L — do U wskoczyło,
  S — się wyprostowało,
  R — prawą nogę złamało,
  W — stanęło do góry dnem
  i udaje, że jest M.
