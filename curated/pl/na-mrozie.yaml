kind: inline
title: Na mrozie
author: Maria Konopnicka
licence: public-domain
source: https://wolnelektury.pl/katalog/lektura/na-mrozie/
tags:
  level: A2
text: |-
  A!… dzień dobry, panie Gilu!
  Jak się mają dzieci?
  Czy pan Gil tu śpiewać przyszedł,
  Czy zamiatać śmieci?

  Pan Gil piękny ma tołubek,
  Czerwony, aż miło!
  I nas mama otuliła,
  Żeby ciepło było.

  Pan Gil może o tem nie wie,
  Że nam Bóg dał mamę?
  Ale teraz leży chora,
  Więc pracujem same.

  To jest moja siostra Basia,
  A ja Małgorzatka,
  A to nasza stara miotła,
  A to nasza chatka.


  Chatka musi być chędoga,
  Niezasuta śmieciem,
  No!… Frrrru teraz panie Gilu,
  Bo miotłą wymieciem!
