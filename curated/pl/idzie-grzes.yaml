kind: inline
title: Idzie Grześ
author: Julian Tuwim
licence: public-domain
source: https://wolnelektury.pl/katalog/lektura/tuwim-idzie-grzes/
tags:
  level: A2
text: |-
  Idzie Grześ
  Przez wieś,
  Worek piasku niesie,
  A przez dziurkę
  Piasek ciurkiem
  Sypie się za Grzesiem.

  «Piasku mniej —
  Nosić lżej!»
  Cieszy się głuptasek.
  Do dom wrócił,
  Worek zrzucił,
  Ale gdzie ten piasek?

  Wraca Grześ
  Przez wieś,
  Zbiera piasku ziarnka.
  Pomaluśku,
  Powoluśku
  Zebrała się miarka.

  Idzie Grześ
  Przez wieś,
  Worek piasku niesie,
  A przez dziurkę
  Piasek ciurkiem
  Sypie się za Grzesiem…
  itd.
