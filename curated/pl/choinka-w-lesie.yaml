kind: inline
title: Choinka w lesie
author: Maria Konopnicka
licence: public-domain
source: https://wolnelektury.pl/katalog/lektura/choinka-w-lesie/
tags:
  level: A2
text: |-
  A kto tę choinkę
  Zasiał w ciemnym lesie?
  — Zasiał ci ją ten wiaterek,
  Co nasionka niesie.

  — A kto tę choinkę
  Ogrzał w ciemnym boru?
  — Ogrzało ją to słoneczko
  Z niebieskiego dworu.

  — A kto tę choinkę
  Poił w ciemnym gaju?
  — Jasne ją poiły rosy
  I woda z ruczaju.

  — A kto tę choinkę
  Wyhodował z ziarna?
  — Wychowała ją mateńka,
  — Ziemia nasza czarna!
